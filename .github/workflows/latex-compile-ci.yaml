name: LaTeX Compile Workflow

on:
  workflow_call:
    inputs:
      pdf_name:
        required: true
        type: string
        description: "The desired name of the output PDF (without the .pdf extension)"

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restrict compilation to numbered chapters
        shell: bash
        run: |
          files=$(find _chapters -maxdepth 1 -type f -name '[0-9]*.tex' -printf '%f\n' | sort | sed 's/\.tex$//' | paste -sd, -)

          if [ -z "$files" ]; then
            echo "No numbered chapter files found in _chapters; main.tex will be compiled as-is."
            exit 0
          fi

          {
            printf '\\includeonly{%s}\n' "$files"
            cat main.tex
          } > main.ci.tex

          mv main.ci.tex main.tex
          echo "Applied includeonly for chapters: $files"

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex 

      - name: Rename PDF
        run: mv main.pdf ${{ inputs.pdf_name }}.pdf

      - name: Get current date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create New Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.date.outputs.today }}.${{ github.run_number }}"
          name: "${{ inputs.pdf_name }} Update - ${{ steps.date.outputs.today }}"

          body: "Automated compile from commit ${{ github.sha }}"
          files: ${{ inputs.pdf_name }}.pdf

          make_latest: true